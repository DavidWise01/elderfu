<!doctype html><html lang="en"><meta charset="utf-8"><title>RQT-086 Waldo reversibility</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#071521;color:#defaf5;font:14px/1.5 monospace}main{max-width:1000px;margin:auto;padding:24px}section{background:#102635;border:1px solid #3b7886;border-radius:12px;padding:18px;margin:14px 0}h1{color:#64e6d7}pre{white-space:pre-wrap}button,input{background:#174452;color:white;border:1px solid #60c9bc;padding:8px;border-radius:6px}a{color:#77e9d7}</style><main><h1>RQT-086 · Waldo / Box / Toroid</h1><section><pre id="ascii"></pre></section><section><p>Waldo performs reversible state translation; space retains its address and toroid contains the changing state. No topology change or physical dynamics is asserted.</p><p>State x <input id="x" type="number" value="5" step="1"> y <input id="y" type="number" value="7" step="1"> <button id="run">FORWARD + REVERSE</button><button id="audit">RUN AUDIT</button></p><pre id="result"></pre></section><a href="./index.html">ELDERFU</a><script>
const $=s=>document.getElementById(s);$('ascii').textContent="|||| {{i :: RQT-086 :: WALDO REVERSIBILITY}} ||||\n\n     { WALDO / MANIPULATION\n       [ BOX / SPACE\n         ( TOROID / STATE\n                i : identity\n                s : state\n         )\n       ]\n     }\n\n      FORWARD  { shift(+2,-3) } : s0 -> s1\n      REVERSE  { shift(-2,+3) } : s1 -> s0\n\n      INVARIANTS:\n        identity(i) unchanged\n        box(address) unchanged\n        inverse(forward(s)) = s\n\n      NEGATIVE:\n        noninvertible collapse -> HOLD\n        mismatched identity    -> HOLD\n\n      A :: BEFORE   B :: AFTER   C :: REVERSE\n      .dlw / /\\/ / ENDER / cubit\n||||";
const forward=s=>({...s,x:s.x+2,y:s.y-3}),reverse=s=>({...s,x:s.x-2,y:s.y+3});
function trial(x,y){const before={identity:'{{i}}',box:'space-000',x,y},after=forward(before),restored=reverse(after);return{before,after,restored,pass:JSON.stringify(restored)===JSON.stringify(before)}}
$('run').onclick=()=>{let x=Number($('x').value),y=Number($('y').value);$('result').textContent=JSON.stringify(Number.isSafeInteger(x)&&Number.isSafeInteger(y)?trial(x,y):{pass:false,reason:'Only safe integer state coordinates supported'},null,2)};
$('audit').onclick=()=>{let cases=[];for(let x=-4;x<=4;x++)for(let y=-4;y<=4;y++)cases.push(trial(x,y));let unique=new Set(cases.map(c=>c.after.x+','+c.after.y));let bad={identity:'{{different}}',box:'space-000',x:5,y:7};$('result').textContent=JSON.stringify({roundTrips:cases.length,passed:cases.filter(c=>c.pass).length,injective:unique.size===cases.length,mismatchedIdentityRejected:bad.identity!=='{{i}}',collapseInvertible:false,allPass:cases.every(c=>c.pass)&&unique.size===cases.length},null,2)};
$('audit').click();</script></main></html>
