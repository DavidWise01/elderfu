<!doctype html><html><meta charset="utf-8"><title>RQT-063 Bubble Wall Coupling</title><style>body{background:#081421;color:#dff;font:14px monospace;margin:0}main{max-width:1050px;margin:auto;padding:25px}canvas{width:100%;background:#040b16}section{border:1px solid #377787;padding:16px;margin:15px 0;border-radius:10px}button,select{background:#183b4c;color:#eff;padding:9px;border:1px solid #6dd}a{color:#8ef}pre{white-space:pre-wrap}</style><main><h1>|||| RQT-063 · Expanding Bubble Boundary</h1><p>A finite-radius particle coupled to a moving reflective wall. Electrum stays an optional separately specified component.</p><section><canvas id="c" width="960" height="460"></canvas><p><button id="pause">PAUSE</button><button id="reset">RESET</button><button id="audit">RUN AUDIT</button> <label>Wall <select id="mode"><option value="moving">Moving outward</option><option value="fixed">Fixed</option><option value="none">No wall</option></select></label></p><pre id="status"></pre><pre id="tests"></pre></section><p><a href="./rqt-062.html">RQT-062</a> · <a href="./index.html">ELDERFU</a></p><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');
const k=8.9875517923e9,q=1.602176634e-19,m=9.1093837139e-31,a0=5.29177210903e-11,mu=k*q*q/m,dt=1e-19,eps=a0*.005;let state,live=true,path=[];
function force(x,y){const r2=x*x+y*y+eps*eps,t=-mu/(r2*Math.sqrt(r2));return [t*x,t*y]}
function E(s){return .5*m*(s.vx*s.vx+s.vy*s.vy)-k*q*q/Math.sqrt(s.x*s.x+s.y*s.y+eps*eps)}
function reset(){const r=2*a0;state={x:r,y:0,vx:0,vy:Math.sqrt(mu/r),t:0,R:3*a0,u:1700,wallWork:0,collisions:0,initial:0};state.initial=E(state);path=[]}
function advance(s,mode){let [ax,ay]=force(s.x,s.y);s.x+=s.vx*dt+.5*ax*dt*dt;s.y+=s.vy*dt+.5*ay*dt*dt;let [bx,by]=force(s.x,s.y);s.vx+=(ax+bx)*dt/2;s.vy+=(ay+by)*dt/2;s.t+=dt;if(mode==='moving')s.R+=s.u*dt;let r=Math.hypot(s.x,s.y);if(mode!=='none'&&r>s.R){let nx=s.x/r,ny=s.y/r,normal=s.vx*nx+s.vy*ny,wall=mode==='moving'?s.u:0;if(normal>wall){let before=E(s),newNormal=2*wall-normal;s.vx+=(newNormal-normal)*nx;s.vy+=(newNormal-normal)*ny;s.x=nx*s.R;s.y=ny*s.R;s.wallWork+=E(s)-before;s.collisions++}}}
function paint(){g.clearRect(0,0,960,460);g.save();g.translate(480,230);let z=55/a0;g.beginPath();g.strokeStyle='#5bdadb';g.lineWidth=2;g.arc(0,0,Math.min(215,state.R*z),0,7);g.stroke();g.strokeStyle='#547edb';g.beginPath();path.forEach((v,i)=>i?g.lineTo(v[0]*z,v[1]*z):g.moveTo(v[0]*z,v[1]*z));g.stroke();g.fillStyle='#ffae78';g.beginPath();g.arc(0,0,9,0,7);g.fill();g.fillStyle='#70f3da';g.beginPath();g.arc(state.x*z,state.y*z,6,0,7);g.fill();g.restore();$('status').textContent=JSON.stringify({mode:$('mode').value,simulatedTimeSeconds:state.t,bubbleRadiusMeters:state.R,wallVelocityMetersPerSecond:state.u,collisions:state.collisions,energyChangeJoules:E(state)-state.initial,workFromWallJoules:state.wallWork,energyBalanceResidualJoules:E(state)-state.initial-state.wallWork},null,2)}
function animate(){if(live){for(let i=0;i<30;i++){advance(state,$('mode').value);if(i===0)path.push([state.x,state.y])}if(path.length>2000)path.shift()}paint();requestAnimationFrame(animate)}
$('pause').onclick=()=>{live=!live;$('pause').textContent=live?'PAUSE':'RESUME'};$('reset').onclick=reset;$('mode').onchange=reset;
$('audit').onclick=()=>{const results=[];for(const mode of ['none','fixed','moving']){reset();for(let i=0;i<15000;i++)advance(state,mode);results.push({mode,collisions:state.collisions,finite:[state.x,state.y,state.vx,state.vy].every(Number.isFinite),relativeBalanceResidual:Math.abs(E(state)-state.initial-state.wallWork)/Math.abs(state.initial),wallWorkJ:state.wallWork})}$('tests').textContent=JSON.stringify(results,null,2);reset()};reset();animate();
</script></main></html>
